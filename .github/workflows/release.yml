name: Release

# Every push to main is tested, then published as a container image (GHCR) and a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Real Samba (SMB3, signing + encryption required) and OpenSSH, so the SMB and SFTP adapters are tested against actual servers.
      - run: sudo bash scripts/ci-external-servers.sh
      - run: pnpm test
        env:
          SD_TEST_SFTP: 127.0.0.1:2222:sduser:pass123:/srv/sftproot
          SD_TEST_SMB: 127.0.0.1:445:sduser:pass123:share
      - run: pnpm build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v4

      # 1.0.<run number>: monotonically increasing, no commit back to the repo (so no workflow loops).
      - name: Compute version
        id: v
        run: |
          base=$(node -p "require('./package.json').version" | cut -d. -f1,2)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.v.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v${v}" --target "${{ github.sha }}" --title "SuperDrive v${v}" --generate-notes \
            --notes "Container image: \`${{ env.IMAGE }}:${v}\`

          \`\`\`bash
          docker pull ${{ env.IMAGE }}:${v}
          \`\`\`"
