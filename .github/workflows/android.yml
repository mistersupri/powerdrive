name: Android

on:
  push:
    # main publishes a release; any other branch only checks that the app builds.
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key (repository secrets, else the public fallback key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING=secrets" >> "$GITHUB_ENV"
          else
            echo "SIGNING=public" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (run on the JVM, no emulator needed)
        run: gradle -p apps/android testReleaseUnitTest --no-daemon

      - name: Build
        run: gradle -p apps/android assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Keep the APK of a branch build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SuperDrive-branch-build
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          APK="SuperDrive-$V.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          NOTE="Aplikasi Android SuperDrive $V — membungkus web app SuperDrive Anda.

          - Android 7.0 (API 24) atau lebih baru.
          - Buka aplikasi, masukkan alamat server SuperDrive Anda, lalu masuk seperti biasa.
          - Izinkan pemasangan dari sumber tak dikenal saat memasang APK ini.
          - Server tanpa HTTPS (http://) hanya aman di jaringan tepercaya."
          if [ "$SIGNING" = "public" ]; then
            NOTE="$NOTE
          - Catatan: APK ini ditandatangani dengan kunci publik bawaan repositori (siapa pun dapat membuat APK dengan tanda tangan yang sama). Untuk produksi, isi secret ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
          fi
          gh release create "android-v$V" "$APK" "$APK.sha256" --title "SuperDrive Android $V" --notes "$NOTE" --target "$GITHUB_SHA"
