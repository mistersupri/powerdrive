<html lang="id">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769E8" />
    <title>SuperDrive</title>
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { var t = localStorage.getItem("sd-theme"); if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
