<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Power Drive</title>
    <!-- Placeholder monogram until a real logo exists (see DESIGN.md). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b2520'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='%23fffdfa' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Power Drive: unggah berkas ke server, kelola folder, dan sinkronkan ke Google Drive." />
    <meta name="theme-color" content="#f6f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      (function () {
        try {
          var saved = localStorage.getItem("powerdrive:theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
